<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2E"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#2DD4BF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#E8FFFB"/>
      <stop offset="0.45" stop-color="#7BEDE0"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="none" stroke="#1E3A52" stroke-width="2" opacity="0.6"/>

  <!-- glow atras da marca -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- hub: 6 raios (hexagono flat-top: angulos 0,60,...300) -->
  <g stroke="#136B66" stroke-width="13" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="256" x2="394" y2="256"/>
    <line x1="256" y1="256" x2="325" y2="136.5"/>
    <line x1="256" y1="256" x2="187" y2="136.5"/>
    <line x1="256" y1="256" x2="118" y2="256"/>
    <line x1="256" y1="256" x2="187" y2="375.5"/>
    <line x1="256" y1="256" x2="325" y2="375.5"/>
  </g>

  <!-- anel de conexao entre nos -->
  <path d="M394 256 L325 136.5 L187 136.5 L118 256 L187 375.5 L325 375.5 Z"
        fill="none" stroke="#136B66" stroke-width="7" opacity="0.45"/>

  <!-- nos perifericos -->
  <g fill="url(#node)">
    <circle cx="394" cy="256" r="30"/>
    <circle cx="325" cy="136.5" r="30"/>
    <circle cx="187" cy="136.5" r="30"/>
    <circle cx="118" cy="256" r="30"/>
    <circle cx="187" cy="375.5" r="30"/>
    <circle cx="325" cy="375.5" r="30"/>
  </g>
  <!-- contorno sutil dos nos para separar do raio -->
  <g fill="none" stroke="#0A1422" stroke-width="6">
    <circle cx="394" cy="256" r="30"/>
    <circle cx="325" cy="136.5" r="30"/>
    <circle cx="187" cy="136.5" r="30"/>
    <circle cx="118" cy="256" r="30"/>
    <circle cx="187" cy="375.5" r="30"/>
    <circle cx="325" cy="375.5" r="30"/>
  </g>

  <!-- nucleo -->
  <circle cx="256" cy="256" r="58" fill="#0A1422"/>
  <circle cx="256" cy="256" r="50" fill="url(#core)"/>
</svg>
